[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aln-model"
version = "0.1.0"
description = "Auditable ALN/XBAW S11 surrogate preparation pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Huang Qi" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "joblib",
  "openpyxl",
]

[project.optional-dependencies]
dev = ["build", "pytest", "pyyaml", "ruff"]

[project.urls]
Homepage = "https://github.com/huang-qi/aln-model"
Repository = "https://github.com/huang-qi/aln-model"
Issues = "https://github.com/huang-qi/aln-model/issues"

[project.scripts]
aln-model = "aln_model.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["aln_model*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9"]
